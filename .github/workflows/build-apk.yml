name: Build GENJUR STREAM APK

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 37
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-37" "build-tools;35.0.0" "platform-tools"

      - name: Generate increasing app version
        run: |
          VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))
          VERSION_NAME="0.5.$((GITHUB_RUN_NUMBER + 2))"
          echo "GENJUR_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "GENJUR_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "Release version: $VERSION_NAME ($VERSION_CODE)"

      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/genjur-stream-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/genjur-stream-release.jks" >> "$GITHUB_ENV"

      - name: Build APK with stable signing key
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleDebug

      - name: Update latest.json with the built version
        run: |
          printf '{\n  "versionCode": %s,\n  "versionName": "%s",\n  "apkUrl": "https://github.com/genjur84/GENJUR-STREAM/releases/download/latest/app-debug.apk"\n}\n' "$GENJUR_VERSION_CODE" "$GENJUR_VERSION_NAME" > latest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json
          if ! git diff --cached --quiet; then
            git commit -m "Update latest app version [skip ci]"
            # Another workflow or source update may push while this build is running.
            # Rebase the version update onto the newest main before pushing.
            git fetch origin main
            if ! git rebase origin/main; then
              git checkout --theirs latest.json
              git add latest.json
              GIT_EDITOR=true git rebase --continue
            fi
            git push origin HEAD:main
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GENJUR-STREAM-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish latest APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: GENJUR STREAM Latest
          body: APK terbaru GENJUR STREAM. Unduh app-debug.apk.
          make_latest: true
          files: app/build/outputs/apk/debug/app-debug.apk
          overwrite_files: true
